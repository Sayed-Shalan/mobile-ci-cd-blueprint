name: Android app

on:
  workflow_call:
    inputs:
      compile-sdk-package:
        description: sdkmanager package for compileSdk, for example platforms;android-37.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "${{ inputs.compile-sdk-package }}"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test lintDebug assembleDebug --stacktrace
